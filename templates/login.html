<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cleanstock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <div class="login-container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Cleanstock" class="logo">
        <h2>Cleanstock</h2>
        <p class="description">Gestión simple y visual del inventario de productos de limpieza.</p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <label for="username">Usuario</label>
            <input type="text" name="username" placeholder="Ej. admin" required>

            <label for="password">Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required>

            <button type="submit">Iniciar sesión</button>

            <div class="extra-options">
                <label><input type="checkbox" name="remember"> Recordarme</label>
                <a href="/recover-password">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>
</body>
</html>
