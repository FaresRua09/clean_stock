<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cleanstock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}"> <!-- Estilos específicos del login -->
</head>
<body>
    <div class="login-container">
        <h2>Cleanstock</h2>

        <!-- Mostrar mensaje de error si lo hay -->
        {% if error %}
            <p style="color: red; margin-bottom: 15px;">{{ error }}</p>
        {% endif %}

        <form action="/login" method="POST">
            <label for="username">Usuario o Correo Electrónico</label>
            <input type="text" name="username" placeholder="Username" required>

            <label for="password">Contraseña</label>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>

            <div class="extra-options">
                <label><input type="checkbox" name="remember"> Recordarme</label>
                <a href="/recover-password">¿Olvidaste tu contraseña?</a>
            </div>
        </form>        
    </div>
</body>
</html>
